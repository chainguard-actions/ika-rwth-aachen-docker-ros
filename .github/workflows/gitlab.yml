name: GitLab

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:

  trigger-ros2:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pipeline
        env:
          GITLAB_TRIGGER_TOKEN: ${{ secrets.DOCKER_ROS_CI_TRIGGER_GITLAB_TOKEN }}
          GIT_SHA: ${{ github.sha }}
        run: |
          curl --silent --fail --request POST \
            --form "token=$GITLAB_TRIGGER_TOKEN" \
            --form "ref=main" \
            --form "variables[DOCKER_ROS_GIT_REF]=""$GIT_SHA" \
            "https://gitlab.ika.rwth-aachen.de/api/v4/projects/1886/trigger/pipeline" \
            | jq -r .id > id

      - name: Upload pipeline ID
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: id_ros2
          path: id

  watch-ros2:
    runs-on: ubuntu-latest
    needs: trigger-ros2
    steps:
      - name: Get pipeline ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: id_ros2
      - name: Wait for pipeline completion
        env:
          GITLAB_READ_TOKEN: ${{ secrets.DOCKER_ROS_CI_READ_PIPELINE_GITLAB_TOKEN }}
        run: |
          PIPELINE_ID=$(cat id)
          while true; do
            sleep 30
            PIPELINE_STATUS=$(curl --silent --header "PRIVATE-TOKEN: $GITLAB_READ_TOKEN" "https://gitlab.ika.rwth-aachen.de/api/v4/projects/1886/pipelines/$PIPELINE_ID" | jq -r .status)
            echo "Pipeline status: $PIPELINE_STATUS (https://gitlab.ika.rwth-aachen.de/fb-fi/ops/docker-ros-ci/-/pipelines/$PIPELINE_ID)"
            if [[ $PIPELINE_STATUS == "success" ]]; then
              break
            elif [[ $PIPELINE_STATUS == "failed" ]]; then
              exit 1
            elif [[ $PIPELINE_STATUS == "canceled" ]]; then
              exit 1
            fi
          done
