name: Test QEMU setup and architecture detection
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          base-image: ubuntu:22.04
          ros-distro: humble
          target: dev
          platform: amd64
          enable-checkout: "false"
          enable-slim: "false"
          image-name: ghcr.io/test-org/test-repo
          image-tag: test
          registry: ghcr.io
          registry-user: test-user
          registry-password: fake-password-for-test

      - name: Assert action ran (build attempted or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert docker-ros was set up
        run: |
          if [ -d "docker/docker-ros" ]; then
            echo "PASS: docker/docker-ros directory exists"
          else
            echo "FAIL: docker/docker-ros directory was not created"
            exit 1
          fi

      - name: Assert dpkg is available (used by QEMU setup step)
        run: |
          ARCH=$(dpkg --print-architecture)
          echo "Runner architecture: $ARCH"
          if [ -z "$ARCH" ]; then
            echo "FAIL: dpkg --print-architecture returned empty"
            exit 1
          fi
          echo "PASS: architecture detected as '$ARCH'"
