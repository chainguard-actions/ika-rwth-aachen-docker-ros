name: Test docker-ros with enable-checkout disabled
on:
  workflow_dispatch:
jobs:
  test-no-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke the action with enable-checkout=false to test that the checkout
      # step is skipped. The action will attempt a Docker build; under the harness
      # the Docker build will fail (no ROS_DISTRO, no real registry), so we allow
      # failure and verify the action ran.
      - id: action
        uses: .
        continue-on-error: true
        with:
          base-image: ubuntu:22.04
          target: dev
          enable-checkout: "false"
          registry: ghcr.io
          image-name: ghcr.io/test/docker-ros-test
          image-tag: ci-test
          enable-slim: "false"

      - name: Assert action ran with checkout disabled (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with enable-checkout=false (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
