name: Test QEMU architecture detection
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          base-image: ubuntu:22.04
          target: dev
          enable-checkout: "false"
          enable-slim: "false"
          image-name: ghcr.io/test-org/test-repo
          image-tag: ci-test
          registry: ghcr.io

      - name: Assert action ran and RUNNER_ARCH was detected
        run: |
          # The action's "Prepare setup of QEMU" step runs dpkg --print-architecture
          # We verify the host can detect its architecture
          ARCH=$(dpkg --print-architecture)
          echo "Host architecture: $ARCH"
          if [ -z "$ARCH" ]; then
            echo "FAIL: could not detect architecture"
            exit 1
          fi
          echo "PASS: architecture detected as '$ARCH'"

      - name: Assert action outcome is acceptable
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo / no real registry)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
