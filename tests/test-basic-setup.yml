name: Test basic setup (dev target, no push)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx (pre-requisite)
        run: docker buildx create --use || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          base-image: ubuntu:22.04
          ros-distro: humble
          target: dev
          enable-checkout: "false"
          enable-slim: "false"
          image-name: ghcr.io/test-org/test-repo
          image-tag: test
          registry: ghcr.io
          registry-user: test-user
          registry-password: fake-password-for-test

      - name: Assert action ran (build attempted or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert docker directory was created
        run: |
          if [ -d "docker" ]; then
            echo "PASS: docker directory exists"
          else
            echo "FAIL: docker directory was not created"
            exit 1
          fi
