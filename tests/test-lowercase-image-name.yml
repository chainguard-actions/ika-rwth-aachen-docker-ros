name: Test lowercase image name enforcement
on:
  workflow_dispatch:

jobs:
  test-lowercase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke the action (will fail at build step, that's expected)
      - id: action
        name: Invoke docker-ros action
        uses: .
        with:
          base-image: ubuntu:22.04
          target: dev
          enable-checkout: "false"
          enable-slim: "false"
          image-name: ghcr.io/MyOrg/MyRepo
          image-tag: ci-test
        continue-on-error: true

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

      # Test the lowercase enforcement logic used by docker-ros
      # The action uses ASzc/change-string-case-action internally to enforce lowercase
      # We test the equivalent bash logic here

      - name: Test lowercase enforcement for mixed-case image name
        run: |
          INPUT="ghcr.io/MyOrg/MyRepo"
          ACTUAL=$(echo "$INPUT" | tr '[:upper:]' '[:lower:]')
          echo "input: $INPUT"
          echo "actual: $ACTUAL"
          EXPECTED="ghcr.io/myorg/myrepo"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: image name correctly lowercased"

      - name: Test lowercase enforcement for uppercase image name
        run: |
          INPUT="GHCR.IO/MYORG/MYREPO"
          ACTUAL=$(echo "$INPUT" | tr '[:upper:]' '[:lower:]')
          echo "input: $INPUT"
          echo "actual: $ACTUAL"
          EXPECTED="ghcr.io/myorg/myrepo"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: uppercase image name correctly lowercased"

      - name: Test lowercase enforcement for already-lowercase name
        run: |
          INPUT="ghcr.io/myorg/myrepo"
          ACTUAL=$(echo "$INPUT" | tr '[:upper:]' '[:lower:]')
          echo "input: $INPUT"
          echo "actual: $ACTUAL"
          EXPECTED="ghcr.io/myorg/myrepo"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: already-lowercase name remains unchanged"

      - name: Test image name with tag lowercase enforcement
        run: |
          INPUT="ghcr.io/MyOrg/MyRepo:MyTag"
          ACTUAL=$(echo "$INPUT" | tr '[:upper:]' '[:lower:]')
          echo "input: $INPUT"
          echo "actual: $ACTUAL"
          EXPECTED="ghcr.io/myorg/myrepo:mytag"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: image name with tag correctly lowercased"

      - name: Test default image name format
        run: |
          # Simulate the default image name: ghcr.io/${{ github.repository }}
          # github.repository is typically lowercase but may contain uppercase
          REPO="MyOrg/MyRepo"
          IMAGE_NAME="ghcr.io/${REPO}"
          ACTUAL=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "image name: $IMAGE_NAME"
          echo "actual lowercase: $ACTUAL"
          EXPECTED="ghcr.io/myorg/myrepo"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "FAIL: expected '$EXPECTED' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: default image name format correctly lowercased"
