name: Test lowercase image name enforcement
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify docker-ros directory does not exist yet
        run: |
          if [ -d "$GITHUB_WORKSPACE/docker/docker-ros" ]; then
            echo "FAIL: docker/docker-ros already exists before action runs"
            exit 1
          fi
          echo "PASS: docker/docker-ros does not exist yet"

      - id: action
        uses: .
        continue-on-error: true
        with:
          base-image: ubuntu:22.04
          target: dev
          enable-checkout: "false"
          enable-slim: "false"
          image-name: ghcr.io/Test-Org/Test-Repo
          dev-image-name: ghcr.io/Test-Org/Test-Repo
          slim-image-name: ghcr.io/Test-Org/Test-Repo
          image-tag: ci-test
          registry: ghcr.io

      - name: Assert docker-ros directory was set up
        run: |
          echo "Checking docker/docker-ros directory..."
          if [ -d "$GITHUB_WORKSPACE/docker/docker-ros" ]; then
            echo "PASS: docker/docker-ros directory was created by the action"
          else
            echo "FAIL: docker/docker-ros directory was not created"
            exit 1
          fi

      - name: Assert action outcome is acceptable
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo / no real registry)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
