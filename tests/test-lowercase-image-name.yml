name: Test lowercase image name enforcement
on:
  workflow_dispatch:

jobs:
  test-lowercase:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke docker-ros action with mixed-case image name
        id: action
        uses: .
        continue-on-error: true
        with:
          base-image: ubuntu:22.04
          target: dev
          enable-checkout: "false"
          enable-slim: "false"
          image-name: ghcr.io/Test/MyImage
          dev-image-name: ghcr.io/Test/MyImage
          slim-image-name: ghcr.io/Test/MyImage
          image-tag: test

      - name: Assert action.yml exists in action directory
        run: |
          echo "Checking that action.yml exists..."
          # Locate action directory
          ACTION_DIR="${GITHUB_WORKSPACE}/pristine/ika-rwth-aachen--docker-ros/v1.10.0"
          if [ ! -f "${ACTION_DIR}/action.yml" ]; then
            ACTION_DIR="${GITHUB_WORKSPACE}"
          fi
          echo "Action directory: ${ACTION_DIR}"

          if [ ! -f "${ACTION_DIR}/action.yml" ]; then
            echo "FAIL: action.yml not found"
            exit 1
          fi
          echo "PASS: action.yml found"

      - name: Assert lowercase conversion logic works correctly
        run: |
          echo "Testing lowercase conversion logic..."
          MIXED_CASE="ghcr.io/Test/MyImage"
          LOWER_CASE=$(echo "${MIXED_CASE}" | tr '[:upper:]' '[:lower:]')
          echo "Input:  ${MIXED_CASE}"
          echo "Output: ${LOWER_CASE}"
          EXPECTED="ghcr.io/test/myimage"
          if [ "${LOWER_CASE}" != "${EXPECTED}" ]; then
            echo "FAIL: expected '${EXPECTED}', got '${LOWER_CASE}'"
            exit 1
          fi
          echo "PASS: lowercase conversion works correctly"

      - name: Assert image name with uppercase would be rejected by Docker
        run: |
          echo "Verifying that lowercase enforcement is needed..."
          MIXED_CASE="ghcr.io/Test/MyImage"
          if echo "${MIXED_CASE}" | grep -q '[A-Z]'; then
            echo "PASS: mixed-case image name contains uppercase letters (enforcement needed)"
          else
            echo "FAIL: test image name has no uppercase letters"
            exit 1
          fi
          LOWER_CASE=$(echo "${MIXED_CASE}" | tr '[:upper:]' '[:lower:]')
          if echo "${LOWER_CASE}" | grep -q '[A-Z]'; then
            echo "FAIL: lowercase conversion still has uppercase letters"
            exit 1
          fi
          echo "PASS: lowercase conversion removes all uppercase letters"

      - name: Assert all-lowercase image name passes through unchanged
        run: |
          echo "Testing that already-lowercase names are unchanged..."
          LOWER_INPUT="ghcr.io/test/myimage"
          LOWER_OUTPUT=$(echo "${LOWER_INPUT}" | tr '[:upper:]' '[:lower:]')
          if [ "${LOWER_INPUT}" != "${LOWER_OUTPUT}" ]; then
            echo "FAIL: lowercase input was changed: '${LOWER_INPUT}' -> '${LOWER_OUTPUT}'"
            exit 1
          fi
          echo "PASS: already-lowercase name is unchanged"

      - name: Assert action uses change-string-case-action for lowercase enforcement
        run: |
          echo "Checking that action.yml references change-string-case-action..."
          # Locate action directory
          ACTION_DIR="${GITHUB_WORKSPACE}/pristine/ika-rwth-aachen--docker-ros/v1.10.0"
          if [ ! -f "${ACTION_DIR}/action.yml" ]; then
            ACTION_DIR="${GITHUB_WORKSPACE}"
          fi

          if ! grep -q "change-string-case-action" "${ACTION_DIR}/action.yml"; then
            echo "FAIL: change-string-case-action not referenced in action.yml"
            exit 1
          fi
          echo "PASS: change-string-case-action is referenced in action.yml"
