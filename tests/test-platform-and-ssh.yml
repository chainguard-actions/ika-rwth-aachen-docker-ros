name: Test docker-ros with platform and SSH credentials
on:
  workflow_dispatch:
jobs:
  test-platform-and-ssh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke the action with a specific platform and SSH credential inputs.
      # The action will attempt a Docker build; under the harness the Docker build
      # will fail (no real registry, no real SSH key), so we allow failure and
      # verify the action ran.
      - id: action
        uses: .
        continue-on-error: true
        with:
          base-image: ubuntu:22.04
          target: dev
          enable-checkout: "false"
          registry: ghcr.io
          image-name: ghcr.io/test/docker-ros-test
          image-tag: ci-test
          enable-slim: "false"
          platform: amd64
          git-ssh-known-host-keys: "github.com ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC"
          git-ssh-private-key: "-----BEGIN OPENSSH PRIVATE KEY-----\nfake-key-for-testing\n-----END OPENSSH PRIVATE KEY-----"

      - name: Assert action ran with platform and SSH credential inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with platform=amd64 and SSH credential inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
