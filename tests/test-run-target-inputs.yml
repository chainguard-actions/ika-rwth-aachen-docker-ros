name: Test run target with extended inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up docker-ros directory structure
        run: |
          mkdir -p docker

      - id: action
        uses: .
        continue-on-error: true
        with:
          base-image: ubuntu:22.04
          target: run
          command: echo hello
          ros-distro: humble
          platform: amd64
          slim-image-tag: test-slim
          git-ssh-known-host-keys: ""
          git-ssh-private-key: ""
          enable-checkout: "false"
          enable-slim: "false"
          image-name: ghcr.io/test/docker-ros-test
          image-tag: test

      - name: Assert action ran (build attempted or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in test environment without full Docker/ROS setup)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
