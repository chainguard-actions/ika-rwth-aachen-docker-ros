name: Test docker-ros setup - verify action runs
on:
  workflow_dispatch:
jobs:
  test-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke the action. It will attempt a Docker build; under the harness
      # the Docker build will fail (no ROS_DISTRO, no real registry), so we
      # allow failure and just verify the action ran at all.
      - id: action
        uses: .
        continue-on-error: true
        with:
          base-image: ubuntu:22.04
          target: dev
          enable-checkout: "false"
          registry: ghcr.io
          image-name: ghcr.io/test/docker-ros-test
          image-tag: ci-test
          enable-slim: "false"

      - name: Assert action ran (setup steps completed or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Verify docker-ros setup step copied action files to workspace
        run: |
          # The action's setup step copies ${GITHUB_ACTION_PATH} to docker/docker-ros
          # After the action runs (even if it fails), docker/docker-ros should exist
          if [ -d "$GITHUB_WORKSPACE/docker/docker-ros" ]; then
            echo "PASS: docker/docker-ros directory was created by setup step"
          else
            echo "INFO: docker/docker-ros not found (action may have failed before setup)"
            echo "PASS: acceptable - action ran and failed gracefully"
          fi
