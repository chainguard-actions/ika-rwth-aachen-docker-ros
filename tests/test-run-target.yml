name: Test run target with SSH and slim args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          base-image: ubuntu:22.04
          ros-distro: humble
          command: ros2 launch my_package my_launch.py
          additional-slim-build-args: --http-probe-cmd GET /
          git-ssh-known-host-keys: "github.com ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC"
          git-ssh-private-key: "-----BEGIN OPENSSH PRIVATE KEY-----\ntest\n-----END OPENSSH PRIVATE KEY-----"
          target: run
          enable-checkout: "false"
          enable-slim: "false"
          registry: ghcr.io
          registry-user: testuser
          registry-password: testpassword
          image-name: ghcr.io/test/test-image
          dev-image-name: ghcr.io/test/test-image
          slim-image-name: ghcr.io/test/test-image
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed (may have failed at build step due to missing Docker context)"
          echo "PASS: inputs were accepted"
