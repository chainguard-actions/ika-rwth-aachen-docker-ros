name: Test docker-ros run target with ROS distro and command
on:
  workflow_dispatch:
jobs:
  test-run-target-with-ros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Invoke the action with target=run, a ros-distro, a command, and a slim-image-tag.
      # The action will attempt a Docker build; under the harness the Docker build
      # will fail (no real registry), so we allow failure and verify the action ran.
      - id: action
        uses: .
        continue-on-error: true
        with:
          base-image: ubuntu:22.04
          target: run
          command: ros2 launch my_package my_launch.py
          ros-distro: humble
          enable-checkout: "false"
          registry: ghcr.io
          image-name: ghcr.io/test/docker-ros-test
          image-tag: ci-test
          slim-image-tag: ci-slim
          enable-slim: "false"

      - name: Assert action ran with run target, ros-distro, command, and slim-image-tag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with run target, ros-distro=humble, command, slim-image-tag (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
